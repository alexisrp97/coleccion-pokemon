  modal.addEventListener("click", e => {
    if (e.target.classList.contains("x")) e.target.closest(".salerow").remove();
  });

  /* precios: lo pagado y el valor actual, automático o a mano */
  function autoUnit() {
    const tmp = {
      id_product: parseInt(val("id_product").value, 10) || null,
      ptcg_id: val("ptcg_id").value || null,
      quantity: 1, grade_multiplier: val("grade_multiplier") ? val("grade_multiplier").value : 1,
      manual_price: "", sales: [],
    };
    const [v, src] = unitValue(tmp);
    return {v, src};
  }

  function paintPrices() {
    const manual = document.querySelector('[data-vmode="manual"]').classList.contains("on");
    const {v, src} = autoUnit();
    const pagado = num(val("purchase").value);
    const actual = manual ? num(val("manual_price").value) : v;

    const variante = (val("variant").value || "").trim();
    document.getElementById("autoval").innerHTML = manual
      ? (v ? `El catálogo dice <b>${eur(v)}</b>. Tu valor manda sobre él mientras esté puesto.`
           : "Valor puesto a mano. No hay precio de catálogo para esta carta.")
      : (v ? `Ahora mismo <b>${eur(v)}</b> · ${esc(src)}. Se actualiza solo cada vez que refresques precios.` +
             (variante ? ` <b>Ojo</b>: el catálogo cotiza la versión normal; una «${esc(variante)}» suele valer distinto — si es el caso, usa «Lo pongo yo».` : "")
           : "Sin precio de catálogo todavía: enlaza la carta arriba, o ponlo tú a mano.");

    const el = document.getElementById("pnl");
    if (pagado && actual) {
      const d = (actual - pagado) / pagado * 100;
      el.innerHTML = `<span class="${d>=0?"up":"down"}">${d>=0?"+":""}${eur(actual-pagado)} · ${pctTxt(d)}</span>`;
    } else el.textContent = "";
  }

  modal.querySelectorAll("[data-wmode]").forEach(b => b.onclick = () => {
    modal.querySelectorAll("[data-wmode]").forEach(x => x.classList.toggle("on", x === b));
    const busco = b.dataset.wmode === "busco";
    sheet.querySelector('[name="wish"]').value = busco ? "1" : "";
    document.getElementById("wishwrap").style.display = busco ? "flex" : "none";
  });
  modal.querySelectorAll("[data-vmode]").forEach(b => b.onclick = () => {
    const manual = b.dataset.vmode === "manual";
    modal.querySelectorAll("[data-vmode]").forEach(x => x.classList.toggle("on", x === b));
    document.getElementById("manualwrap").style.display = manual ? "flex" : "none";
    if (!manual) val("manual_price").value = "";
    else if (!val("manual_price").value) {
      const {v} = autoUnit();
      if (v) val("manual_price").value = v.toFixed(2);
    }
    paintPrices();
  });
  ["purchase", "manual_price", "variant"].forEach(n => val(n).oninput = paintPrices);
  paintPrices();

  /* foto propia: para cartas que no están catalogadas */
  function paintPhoto() {
    const pic = val("photo").value || val("cache").value || val("image").value;
    document.getElementById("photowrap").innerHTML = pic
      ? `${imgTag((val("photo").value || val("cache").value) ? [pic] : chain(pic), "", "")}
         <span class="hint">${val("photo").value ? "Foto tuya, guardada con la carta."
            : val("cache").value ? "Copia guardada: se ve sin conexión." : "Imagen del catálogo."}</span>`
      : `<span class="hint">Sin imagen. Si la carta no aparece en ningún catálogo, sube una foto tuya: se guarda con la ficha y sale en la lista.</span>`;
  }
  paintPhoto();
  if (d.id) { const el = sheet.querySelector("#cspark"); if (el) el.innerHTML = cardSpark(d); }
  document.getElementById("photobtn").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const img = new Image();
        img.onload = () => {
          const w = 360, h = Math.round(img.height * w / img.width);
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          val("photo").value = cv.toDataURL("image/jpeg", .78);
          paintPhoto();
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(f);
    };
    inp.click();
  };
  document.getElementById("photodel").onclick = () => { val("photo").value = ""; paintPhoto(); };

  /* Foto → código impreso → búsqueda. El lector (Tesseract) se descarga
     de la red la primera vez que se usa, unos segundos. */
  document.getElementById("ocr").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      const hint = document.getElementById("autoval");
      try {
        if (!self.Tesseract) {
          if (hint) hint.innerHTML = `<span class="spin"></span> Descargando el lector de texto (sólo la primera vez)…`;
          await new Promise((okey, mal) => {
            const sc = document.createElement("script");
            sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            sc.onload = okey; sc.onerror = () => mal(new Error("sin conexión con el lector"));
            document.head.appendChild(sc);
          });
        }
        if (hint) hint.innerHTML = `<span class="spin"></span> Leyendo la carta…`;
        /* Primero la franja inferior (donde vive el código), luego la carta entera. */
        const franja = await new Promise(res => {
          const img = new Image();
          img.onload = () => {
            try {
              const cv = document.createElement("canvas");
              cv.width = img.naturalWidth; cv.height = Math.round(img.naturalHeight * 0.24);
              cv.getContext("2d").drawImage(img, 0, -Math.round(img.naturalHeight * 0.76));
              cv.toBlob(b => res(b), "image/png");
            } catch (e2) { res(null); }
          };
          img.onerror = () => res(null);
          img.src = URL.createObjectURL(f);
        });
        let texto = "";
        for (const trozo of [franja, f]) {
          if (!trozo) continue;
          const r = await Tesseract.recognize(trozo, "eng");
          texto = (r && r.data && r.data.text || "").toUpperCase();
          if (leeCodigo(texto)) break;      // la franja ya lo tenía: no hace falta más
        }
        function leeCodigo(t) {
          const m = t.match(/\b([A-Z]{2,4})\s*0*(\d{1,3})\s*\/\s*(\d{1,3})\b/);   // PBL 091/086
          if (m) return m[1] + " " + m[2];
          return (t.match(/\b[A-Z]{2,4}\d{1,2}-\d{1,3}\b/) || [])[0]                 // OP05-060
            || (t.match(/\b\d{1,3}\s*\/\s*\d{1,3}\b/) || [])[0]                   // 091/086
            || (() => { const x = t.match(/\b([A-Z]{2,4})\s?0*(\d{1,3})\b/); return x && !/^(HP|LV|NO)$/.test(x[1]) ? x[1] + " " + x[2] : null; })();
        }
        const code = leeCodigo(texto);
        if (!code) {
          if (hint) hint.textContent = "No he sabido leer ningún código en esa foto. Prueba con más luz y la esquina del número enfocada.";
          return;
        }
        if (hint) hint.innerHTML = `He leído <b>${esc(code)}</b>: buscando y seleccionando…`;
        AUTO_PICK = code;
        fq.value = code.replace(/\s+/g, "");
        runSearch();
      } catch (e) {
        if (hint) hint.textContent = "El lector no ha podido con la foto (" + e.message + ").";
      }
    };
    inp.click();
  };

  /* buscador unificado: catálogo online + catálogo de Cardmarket + tus cartas */

  function paintResults(list, sources, extra) {
    const res = document.getElementById("fres"), src = document.getElementById("fsrc");
    src.innerHTML = (sources.join(" + ") || "sin resultados") + (extra || "");
    if (AUTO_PICK && !extra) {          // resultados definitivos: ¿hay una candidata clara?
      const leida = AUTO_PICK; AUTO_PICK = "";
      const nrm = x => String(x || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/^0+/, "");
      const num1 = x => nrm(String(x || "").split("/")[0]);
      const hit = list.length === 1 ? list[0]
        : list.find(p => nrm(p.number) === nrm(leida) || num1(p.number) === num1(leida));
      if (hit) {
        say(`Reconocida por la foto: <b>${esc(hit.name)}</b>${hit.expansion ? " — " + esc(hit.expansion) : ""}. Revisa y guarda.`);
        choose(hit);
        return;
      }
      say("He leído el código pero hay varias candidatas: elige la tuya en la lista.", true);
    }
    res.innerHTML = list.length ? list.map((p, i) => `<li data-i="${i}" data-optional="${p.origin === "carta oficial" && p.rarity ? 1 : 0}">
      <span>${imgTag(p.images || chain(p.image), "rthumb", p.name)}

        <small>${p.setcode ? `<span class="setcode">${esc(p.setcode)}</span> ` : ""}${esc([p.expansion, p.number, p.rarity].filter(Boolean).join(" · ") || "—")}</small></span></span>

    res.querySelectorAll("li[data-i]").forEach(li => li.onclick = () => choose(list[+li.dataset.i]));
  }

  function localResults(q) {
    const out = [], sources = [];
    let n = 0;
    for (const [id, p] of CATALOG) {
      const name = p.name.toLowerCase();
      if (!name.includes(q)) continue;
      const pr = PRICES.get(id) || {};
      out.push({id_product:id, name:p.name, expansion:p.expansion,
        price: pr.trend ?? pr.avg7 ?? pr.low, origin:"catálogo Cardmarket",
        score: name === q ? 0 : name.startsWith(q) ? 1 : 2});
      if (++n > 400) break;
    }
    if (CATALOG.size && out.length) sources.push("catálogo Cardmarket");
    DB.cards.filter(c => c.name.toLowerCase().includes(q)).slice(0, 6).forEach(c => {
      out.push({id_product:c.id_product, ptcg_id:c.ptcg_id, name:c.name, expansion:c.collection,
        number:c.number, rarity:c.rarity, image:c.photo || c.image, url:c.url,
        origin:"ya en tu colección", score:3});
      if (!sources.includes("tu colección")) sources.push("tu colección");
    });
    return [out, sources];
  }

  let AUTO_PICK = "";   // código leído en una foto, pendiente de auto-selección
  async function runSearch() {
    const q = fq.value.trim().toLowerCase();
    const res = document.getElementById("fres"), src = document.getElementById("fsrc");
    if (q.length < 2) { res.innerHTML = ""; src.textContent = ""; return; }
    const mine = ++reqId;
    const [local, sources] = localResults(q);
    local.sort((a, b) => a.score - b.score || a.name.length - b.name.length);
    paintResults(local.slice(0, 25), sources, ' <span class="spin"></span>');

    let online = [], errors = [];
    try {
      const r = await searchOnline(fq.value.trim(), val("category").value);
      online = r.results; errors = r.errors;
      if (r.sources.length) sources.unshift(...r.sources);
    } catch (e) { errors = [e.message]; }
    if (mine !== reqId) return;

    if (!online.length && errors.length && val("category").value === "pokemon") {
      paintResults(local.slice(0, 25), sources.length ? sources : ["sólo tu colección"], "");
      document.getElementById("fhint").innerHTML = ONLINE_FAIL;
      return;
    }

    // el catálogo online manda cuando la carta ya está en la lista local
    const seen = new Set(online.map(o => (o.name + o.number).toLowerCase()));
    const merged = online.concat(local.filter(l => !seen.has((l.name + (l.number||"")).toLowerCase())));
    merged.sort((a, b) => a.score - b.score || a.name.length - b.name.length);
    paintResults(merged.slice(0, 30), [...new Set(sources)],
      online.length ? ` · ${online.length} versiones` : "");
  }
  /* explorador: buscador de colecciones + cuadrícula con sus imágenes */

  function fillSets() {
    const cat = val("category").value, all = setsFor(cat);
    document.getElementById("browsebtn").style.display = all.length ? "" : "none";
    const t = norm(bfind.value || "");
    const list = t ? all.filter(r =>
      norm(r[1]).includes(t) || norm(r[3] || "").includes(t) || norm(String(r[0])).includes(t)) : all;
    if (bsel && !list.some(r => String(r[0]) === bsel)) bsel = null;
    const numKey = x => String(x || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/^0+/, "");
    const cuantas = new Map();          // colección -> cartas distintas que tengo
    DB.cards.forEach(c => {
      if (c.wish) return;
      const k = norm(c.collection || "");
      if (!k) return;
      if (!cuantas.has(k)) cuantas.set(k, new Set());
      cuantas.get(k).add(numKey(c.number) || norm(c.name));
    });
    const esPoke = val("category").value === "pokemon";
    bsets.innerHTML = list.map(r => {
      const total = (+r[2] || 0) + ((typeof FB_EXTRA !== "undefined" && FB_EXTRA[r[0]]) ? FB_EXTRA[r[0]].length : 0);
      const mias = Math.min((cuantas.get(norm(r[1])) || {size: 0}).size, total);
      const pct = total ? Math.round(100 * mias / total) : 0;
      const barra = mias > 0 ? `<span class="sprog">
          <span class="zbar mini"><span class="zfill" style="width:${pct}%"></span>${
            esPoke ? `<img class="zpika mini" alt="" style="left:${Math.max(pct, 4)}%"
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
              onerror="this.remove()">` : ""}</span>
          <span class="zpct">${mias}/${total} · ${pct}%</span>
        </span>` : "";
      return `<button type="button" class="setbtn${String(r[0])===bsel ? " on" : ""}" data-set="${esc(r[0])}">
         <span class="scol"><span class="sname">${esc(r[1])}</span>${barra}</span>
         <span class="mono dim">${esc(r[3] || "")}${r[3] ? " · " : ""}${total || r[2]} cartas</span></button>`;
    }).join("")
      || `<p class="hint" style="padding:.5rem .7rem;margin:0">Ninguna colección se llama así.
          </p>`;
    bsets.querySelectorAll("[data-set]").forEach(b =>
      b.onclick = () => { bsel = b.dataset.set; fillSets(); paintGrid(); });
  }
  let fillRun = 0;
  async function fillTextImages(cards) {
    const run = ++fillRun;                       // si se repinta, la tanda vieja se detiene
    const prog = document.getElementById("bprog");
    const pend = [];
    cards.forEach((c, i) => { if (!c.images && (c.pmq || c.pmu)) pend.push(i); });
    if (prog) prog.textContent = "";
    if (!pend.length) return;
    const total = pend.length;
    let done = 0, ok = 0;

    async function worker() {
      while (pend.length && run === fillRun) {
        const i = pend.shift(), c = cards[i];
        const u = c.pmu ? await pokumonImgByUrl(c.pmu) : await pokumonImg(c.pmq);
        done++;
        if (u) {
          ok++;
          c.image = u; c.images = chain(u);
          const t = bgrid.querySelector(`[data-g="${i}"]`);
          if (t && t.classList.contains("txt")) {
            t.classList.remove("txt");
            t.innerHTML = imgTag(c.images, "", c.name);
          }
        }
        if (prog && run === fillRun)
          prog.textContent = `Trayendo las fotos del museo… ${done} de ${total}`;
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);   // cuatro a la vez
    if (prog && run === fillRun)
      prog.textContent = `${ok} fotos cargadas${ok < total ? ` · ${total - ok} sin foto en el museo` : ""}.`;
  }

    if (base) {                       // la portada del set viste todas las fichas de entrada

              </span>`;
            }).join("")}
            ${"<span class='apocket vacia'></span>".repeat(PORPAG - pagina.length)}
          </div>
          <div class="acount mono">${reales.filter(tengoLa).length} de ${reales.length} en el álbum</div>
        </div>
      </div>`;
      const pv = document.getElementById("apPrev"), nx = document.getElementById("apNext");
      if (pv) pv.onclick = e => { e.stopPropagation(); ADIR = -1; APAGE--; paintGrid(); };
      if (nx) nx.onclick = e => { e.stopPropagation(); ADIR = 1; APAGE++; paintGrid(); };
      enlazaFichas();
      return;
    }
    fillTextImages(cards);
    enlazaFichas();
    function enlazaFichas() {
    bgrid.querySelectorAll("[data-g]").forEach(t => t.onclick = () => {
      const c = cards[+t.dataset.g];
      if (c.addTo) {
        const nombre = prompt("Nombre de la carta tal y como aparece en Cardmarket:");
        if (!nombre) return;
        choose({name: nombre, expansion: c.addTo, origin: "colección sin numerar"});
        pokumonImg(nombre + " unnumbered").then(u => {
          if (u) { val("image").value = u; paintPhoto(); }
        }).catch(() => {});
        browse.style.display = "none";
        return;
      }
      choose(c);
      if (!c.image && (c.pmu || c.pmq)) {
        (c.pmu ? pokumonImgByUrl(c.pmu) : pokumonImg(c.pmq)).then(u => {
          if (u) { val("image").value = u; paintPhoto(); }
        }).catch(() => {});
      }
      // intenta completar nombre, rareza y precio reales de esa carta
      if (c.ptcg_id) askPtcg(`id:"${c.ptcg_id}"`).then(r => r[0] && choose(r[0])).catch(() => {});
      if (c.op_id) askOptcg(c.op_id).then(r => r[0] && choose(Object.assign({}, r[0], {images:c.images})))
        .catch(() => {});
      browse.style.display = "none";
    });
    }
  }
  document.getElementById("browsebtn").onclick = async () => {
    const open = browse.style.display === "none";
    browse.style.display = open ? "block" : "none";
    if (!open) return;
    document.getElementById("fres").innerHTML = "";
    if (val("category").value === "pokemon") { await loadPkSets(); }
    if (!bsel) bsel = String((setsFor(val("category").value)[0] || [])[0] || "");
    fillSets();
    paintGrid();
    bfind.focus();
  };
  bfind.oninput = fillSets;
  bfind.onkeydown = e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const first = bsets.querySelector("[data-set]");
    if (first) { bsel = first.dataset.set; fillSets(); paintGrid(); }
  };
  fillSets();

  fq.oninput = () => { clearTimeout(timer); timer = setTimeout(runSearch, 320); };
  fq.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(timer); runSearch(); } };
  function catHint() {
    const c = val("category").value, h = document.getElementById("fhint");
    fq.placeholder = c === "onepiece" ? "Nombre o código: Luffy, Shanks, OP01-001, ST12-003…"
      : c === "pokemon" ? "Nombre, o siglas y número: SSP091, SVI 199, sv1 25…"
      : "Nombre de la carta o del jugador";
    h.innerHTML = c === "onepiece"
      ? "Busca por <b>nombre</b> (Luffy, Shanks, Nami…) o por <b>código</b> (OP01-001, ST12-003…); con código salen también las artes alternativas. O pulsa <b>Ver colección</b> y elige de la expansión entera."
      : c === "pokemon"
      ? "Busca en el catálogo online de Pokémon (imagen, colección, número y precio de Cardmarket) y en tus propias cartas. Valen las siglas con el número pegado o separado: SSP091, SSP 091, SVI 199…"
      : "Estas cartas no están en ningún catálogo público: escribe los datos a mano y súbele una foto tuya aquí abajo.";
  }
  val("category").onchange = () => { catHint(); fillSets(); if (browse.style.display !== "none") paintGrid(); runSearch(); };
  catHint();
  runSearch();

  function choose(p) {
    if (p && p.sealed) setTimeout(() => { const el = sheet.querySelector('[name="sealed"]'); if (el) el.value = p.sealed; }, 0);
    if (!p) return;
    val("name").value = p.name || val("name").value;
    if (p.expansion) val("collection").value = p.expansion;
    if (p.number) val("number").value = p.number;
    if (p.rarity) val("rarity").value = p.rarity;
    const img = p.image || (p.images && p.images[0]) || "";
    if (img) val("image").value = img;
    if (p.url) val("url").value = p.url;
    if (p.id_product) val("id_product").value = p.id_product;
    if (p.ptcg_id) {
      val("ptcg_id").value = p.ptcg_id;
      if (p.cm) recordPrice("ptcg:" + p.ptcg_id, p.cm);   // precio de hoy, ya guardado
    } else if (p.op_id) {
      val("ptcg_id").value = "";
      if (!val("collection").value && p.setcode) val("collection").value = p.setcode;
    } else if (p.tcgdex_id) {
      val("ptcg_id").value = p.tcgdex_id;
      enrichTcgdex(p.tcgdex_id).then(extra => {
        if (!extra) return;
        if (extra.cm) { recordPrice("ptcg:" + p.tcgdex_id, extra.cm); persist(); }
        if (extra.expansion && !val("collection").value) val("collection").value = extra.expansion;
        if (extra.rarity && !val("rarity").value) val("rarity").value = extra.rarity;
        if (extra.image) { val("image").value = extra.image; paintPhoto(); }
      });
    }
    const ref = p.id_product ? "idProduct " + p.id_product
              : (p.ptcg_id || p.tcgdex_id || p.op_id) || "";
    const l = document.getElementById("linked");
    if (ref) { l.textContent = "enlazada · " + ref; l.classList.remove("no"); }
    paintPhoto(); paintPrices();
    document.getElementById("fres").innerHTML = "";
    document.getElementById("fhint").textContent = ref
      ? "Enlazada. Su precio de Cardmarket se comparará solo cada vez que actualices."
      : "Sin referencia de catálogo: usa las ventas anotadas a mano y, si quieres, sube una foto.";
  }

  document.getElementById("cancel").onclick = () => modal.innerHTML = "";
  modal.querySelector(".scrim").onclick = e => { if (e.target === e.currentTarget) modal.innerHTML = ""; };
  if (d.id) document.getElementById("del").onclick = () => {
    if (!confirm("¿Eliminar esta carta de la colección?")) return;
    const caida = DB.cards.find(c => c.id === d.id);
    if (caida) {
      const copia = Object.assign({}, caida);
      const foto = photoOf(caida);
      if (foto) copia._foto = foto;
      copia._borrada = Date.now();
      (DB.trash = DB.trash || []).unshift(copia);
      DB.trash = DB.trash.slice(0, 30);
    }
    DB.cards = DB.cards.filter(c => c.id !== d.id);
    (DB.deleted = DB.deleted || []).push(d.id);
    dropPhoto(d.id);
    modal.innerHTML = ""; persist(); render();
  };
  document.getElementById("savecard").onclick = () => {
    const body = {};
    sheet.querySelectorAll("[name]").forEach(el => body[el.name] = el.value);
    if (!body.name.trim()) return alert("La carta necesita un nombre.");
    body.graded = +body.graded ? 1 : 0;
    body.id_product = parseInt(body.id_product, 10) || null;
    body.ptcg_id = body.ptcg_id || null;
    body.sales = [...document.querySelectorAll("#salesrows .salerow")].map(r => ({
      price: r.querySelector(".sp").value, date: r.querySelector(".sd").value
    })).filter(s => s.price !== "");
    if (d.id) {
      DB.cards = DB.cards.map(c => c.id === d.id ? stamp(Object.assign({}, c, body, {id:d.id})) : c);
    } else {
      if (!esPremium() && DB.cards.length >= LIMITE_GRATIS)
        return pidePremium(`Tu vitrina gratuita llegó a las ${LIMITE_GRATIS} cartas: para seguir creciendo, pásate a Premium.`);
      const gemela = DB.cards.find(c => packSig(c) === packSig(body));
      if (gemela && confirm(`Ya tienes «${gemela.name}» (${gemela.collection || "sin colección"}). ¿Sumar 1 a la cantidad en vez de duplicarla?`)) {
        gemela.quantity = (parseInt(gemela.quantity, 10) || 1) + 1;
        stamp(gemela);
      } else {
        body.id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        DB.cards.push(stamp(body));
      }
    }
    snapshot();
    modal.innerHTML = ""; persist(); render();
    // se queda con la foto para que no dependa de internet
    const cid = d.id || body.id;
    if (!body.photo && !PHOTOS.has(cid) && body.image) {
      cachePhoto(body.image).then(data => savePhoto(cid, data)).then(() => render()).catch(() => {});
    }
  };
}

const saleRow = s => `<div class="salerow">

/* ---------------------------------------------------------------- fondos propios */

function addArt(files) {
  if (CAT === "all") return say("Elige primero una sección (Pokémon, Fútbol…) y vuelve a pulsar.", true);
  const cat = CAT;
  let pending = Math.min(files.length, 4);
  [...files].slice(0,4).forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const h = 620, w = Math.round(img.width * h / img.height);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        (ART[cat] = ART[cat] || []).push(cv.toDataURL("image/jpeg", .72));
        if (ART[cat].length > 6) ART[cat] = ART[cat].slice(-6);
        if (--pending === 0) { persistArt(); setScene(cat); say(`Fondo de la sección actualizado.`); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- papelera: los borrados con arrepentimiento ---------------- */
document.getElementById("vitrinabtn").onclick = () =>
  esPremium() ? modoVitrina() : pidePremium("El modo vitrina es de la casa Premium.");
document.getElementById("trashbtn").onclick = () => {
  const t = DB.trash || [];
  const sc = document.createElement("div");
  sc.className = "scrim";
  sc.innerHTML = `<div class="sheet" style="max-width:34rem">
    <div class="blockhead"><h3>Papelera</h3><button class="ghost sm" id="tclose">Cerrar</button></div>
    ${t.length ? `<p class="hint">Las últimas ${t.length} cartas borradas. Recuperar una la devuelve a la colección con su foto.</p>` +
      t.map((c, i) => `<div class="mvrow"><span>${esc(c.name)}${c.collection ? ` <small class="dim">· ${esc(c.collection)}</small>` : ""}</span>
        <button class="ghost sm" data-rec="${i}">Recuperar</button></div>`).join("")
      : `<p class="hint">Vacía. Lo que borres a partir de ahora esperará aquí por si te arrepientes.</p>`}
  </div>`;
  document.body.appendChild(sc);
  sc.onclick = e => {
    if (e.target === sc || e.target.id === "tclose") return sc.remove();
    const b = e.target.closest("[data-rec]"); if (!b) return;
    const c = Object.assign({}, DB.trash[+b.dataset.rec]);
    DB.trash.splice(+b.dataset.rec, 1);
    const foto = c._foto; delete c._foto; delete c._borrada;
    c.id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);   // identidad nueva: revive también en la base compartida
    DB.cards.push(stamp(c));
    if (foto) savePhoto(c.id, foto).catch(() => {});
    snapshot(); persist(); render();
    say(`«${esc(c.name)}» recuperada de la papelera.`);
    sc.remove();
  };
};

function makeBackup(auto) {
  const blob = new Blob([JSON.stringify({db:DB, art:ART}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `collector-app-${today()}${auto ? "-auto" : ""}.json`;
  a.click();
  DB.lastBackup = Date.now();
  persist();
}
document.getElementById("save").onclick = () => makeBackup(false);
/* ---------------- paquetes de cartas para compartir a distancia ----------------
   «Compartir paquete» descarga un fichero con las cartas que estás viendo
   (pestaña y búsqueda actuales), fotos incluidas. La otra persona pulsa
   «Sumar paquete», elige el fichero y esas cartas se añaden a su colección,
   saltándose las que ya tenga. */
function visibleForPack() {
  let list = DB.cards.slice();
  if (CAT !== "all") list = list.filter(c => c.category === CAT);
  if (Q.trim()) {
    const t = Q.toLowerCase();
    list = list.filter(c => [c.name,c.collection,c.number,c.rarity,c.variant,c.sealed,c.cert,c.notes,c.location,c.tags]
      .some(v => String(v||"").toLowerCase().includes(t)));
  }
  return list;
}

const packSig = c => norm([c.name, c.number, c.collection, c.variant, c.sealed, c.category].map(x => x || "").join("|"));

document.getElementById("packout").onclick = () => {
  const list = visibleForPack();
  if (!list.length) return say("No hay cartas a la vista que empaquetar.", true);
  const cards = list.map(c => {
    const copy = Object.assign({}, c);
    delete copy.id; delete copy.u;
    const foto = photoOf(c);
    if (foto) copy.foto = foto;
    return copy;
  });
  const blob = new Blob([JSON.stringify({paquete: "collector.app", fecha: today(), cards})],
    {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const tag = CAT === "all" ? "cartas" : CAT;
  a.download = `paquete-${tag}-${today()}.json`;
  a.click();
  say(`Paquete con <b>${cards.length}</b> carta${cards.length===1?"":"s"} descargado. Envíaselo por donde quieras; en su app: «Sumar paquete».`);
};

const packPicker = document.createElement("input");
packPicker.type = "file"; packPicker.accept = "application/json,.json";
document.getElementById("packin").onclick = () => packPicker.click();
async function sumaPaquete(data) {
      const cards = Array.isArray(data.cards) ? data.cards : null;
      if (!cards) throw new Error("formato");
      const tengo = new Set(DB.cards.map(packSig));
      let added = 0, skipped = 0;
      for (const c of cards) {
        if (tengo.has(packSig(c))) { skipped++; continue; }
        const card = Object.assign({}, c);
        const foto = card.foto; delete card.foto;
        card.id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
        DB.cards.push(stamp(card));
        tengo.add(packSig(card));
        if (foto) { try { await savePhoto(card.id, foto); } catch (e) { /* la foto es extra */ } }
        added++;
      }
      snapshot(); persist(); render(); setScene(CAT);
      say(`Paquete sumado: <b>${added}</b> carta${added===1?"":"s"} nueva${added===1?"":"s"}` +
          (skipped ? ` · ${skipped} ya las tenías y se han saltado` : "") + ".");
}
packPicker.onchange = () => {
  const f = packPicker.files[0]; packPicker.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try { await sumaPaquete(JSON.parse(r.result)); }
    catch (e) { say("Ese fichero no es un paquete de cartas de esta app.", true); }
  };
  r.readAsText(f);
};

const jsonPicker = document.getElementById("jsonpicker");
document.getElementById("restore").onclick = () => jsonPicker.click();
function cargaCopia(data) {
  const db = data.db || data;
  if (!db || !Array.isArray(db.cards)) throw new Error("formato");
  const n = db.cards.length;
  if (DB.cards.length &&
      !confirm(`La copia trae ${n} carta${n===1?"":"s"} y aquí ya hay ${DB.cards.length}. ¿Cargarla igualmente? (Se combinan: tus cartas actuales no se borran.)`))
    return;
  const antes = new Map(DB.cards.map(c => [c.id, c]));
  db.cards.forEach(c => antes.set(c.id, c));       // la copia manda en las repetidas
  DB = Object.assign({}, DB, db, {cards: [...antes.values()]});
  if (data.art) { ART = data.art; persistArt(); }
  snapshot(); persist(); render(); setScene(CAT);
  say(`Copia cargada: <b>${DB.cards.length}</b> cartas en la vitrina.` +
      (SHARED ? " Subiéndola a tu cuenta…" : ""));
}
jsonPicker.onchange = () => {
  const f = jsonPicker.files[0]; jsonPicker.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { cargaCopia(JSON.parse(r.result)); }
    catch (e) { say("Ese fichero no es una copia válida.", true); }
  };
  r.readAsText(f);
};

/* ---------- suelta el fichero encima y la app sabe qué hacer ---------- */
document.addEventListener("dragover", e => { e.preventDefault(); });
document.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !/\.json$/i.test(f.name)) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (data.paquete === "collector.app") return sumaPaquete(data);   // paquete de otro coleccionista
      cargaCopia(data);                                                 // copia de seguridad
    } catch (e2) { say("Ese fichero no es ni una copia ni un paquete de esta app.", true); }
  };
  r.readAsText(f);
});

// atajos: Esc cierra, "/" o Cmd+K van al buscador, "n" crea carta
document.addEventListener("keydown", e => {
  const modal = document.getElementById("modal");
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
    || (document.activeElement && document.activeElement.isContentEditable);
  const panel = document.querySelector(".scrim");            // cuenta, papelera, dueño…
  if (e.key === "Escape" && modal.innerHTML) { modal.innerHTML = ""; return; }
  if (typing || panel) return;                               // escribiendo o con un panel: los atajos, callados
  if ((e.key === "/" || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) && !modal.innerHTML) {
    e.preventDefault(); document.getElementById("q").focus(); return;
  }
  if (e.key.toLowerCase() === "n" && !modal.innerHTML) { e.preventDefault(); openEditor(null); }
});
